apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: capstone-app-production
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/jeffreythachil/capstone-app.git
    targetRevision: main
    path: k8s/overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true